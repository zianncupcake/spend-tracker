# Tests every pull request and every push to main, and deploys what is pushed to main. The README says more of it
# under Deploying.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# What a run may do with the repository: read it, and nothing more.
permissions:
  contents: read

# The runs of a branch go one at a time, and one that has begun is not cancelled for a later one: a deploy that is cut
# off after its migrations leaves the database ahead of the code. A run that is waiting gives way to a later one,
# which has its commits too. The group is the whole run's and not the deploy's alone, so that a push waits for the
# one before it, tests and all, and is not deployed ahead of it because its own tests ended first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_SEND_METRICS: false

jobs:
  # Uses no secret, so it runs the same for a pull request from a fork, which is given none.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Only for a push to main, and only once the tests have passed. A secret is given to the steps that need it and to
  # no others, so the install is run with none.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The real config is not in the repository. It is made from the example, with the id of the database and the
      # three vars added.
      - name: Write wrangler.jsonc
        run: node scripts/deploy-config.mjs
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
          OPERATOR_NAME: ${{ secrets.OPERATOR_NAME }}
          OPERATOR_CONTACT: ${{ secrets.OPERATOR_CONTACT }}

      # Before the code: code that is ahead of its database fails at whatever uses what is not there yet.
      - name: Apply the migrations
        run: npx wrangler d1 migrations apply spend-tracker --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # wrangler is kept to its warnings and errors here. What it prints besides has the values of the vars, and of a
      # value of 40 characters or more only the first 37: GitHub blanks out a secret that is printed whole, and does
      # not know a part of one.
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG: warn

      # The service is asked as anybody would ask it. Only the two statuses are printed, and curl is kept silent, as
      # what it says of a request that failed names the host. 000 is a request that got no answer.
      - name: Check the live service
        env:
          PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
        run: |
          answered() {
            curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "$@" || true
          }
          home=$(answered "$PUBLIC_BASE_URL")
          webhook=$(answered --header 'Content-Type: application/json' --data '{}' "$PUBLIC_BASE_URL/telegram")
          echo "GET of the public URL answered $home, and POST to /telegram with no secret answered $webhook."
          if [ "$home" != 200 ] || [ "$webhook" != 401 ]; then
            echo "::error::The live service has to answer 200 and 401."
            exit 1
          fi
